language: en-US

reviews:
  profile: chill # Use "assertive" for stricter, more thorough reviews.
  request_changes_workflow: false
  poem: false
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  # allow_author_approval: true
  # high_level_summary_instructions: ""
  # high_level_summary_placeholder: "@coderabbitai summary"
  # high_level_summary_in_walkthrough: false
  # auto_title_placeholder: "@coderabbitai"
  # auto_title_instructions: ""
  # review_status: true
  # review_details: false
  # review_progress: true
  # commit_status: true
  # fail_commit_status: false
  # collapse_walkthrough: true
  # estimate_code_review_effort: true
  # assess_linked_issues: true
  # related_issues: true
  # related_prs: true
  # suggested_labels: true
  # auto_apply_labels: false
  # suggested_reviewers: true
  # auto_assign_reviewers: false
  # in_progress_fortune: true
  # enable_prompt_for_ai_agents: true
  # abort_on_close: true
  # disable_cache: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    # description_keyword: ""
    # auto_pause_after_reviewed_commits: 5

  path_filters:
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!**/generated/**"
    - "!**/*.lock"
    - "!third_party/**"

  instructions: |
    This is a Flutter/Dart app (Riverpod state management, feature-first layout
    under lib/features/*/{data,domain,presentation}).
    - Check the PR description against the repo template: flag placeholder text
      that was never filled in (e.g. "Describe what changed and why.").
    - If the PR changes UI or image output, flag it when there are no
      screenshots or before/after images.
    - Prefer concrete, actionable feedback over general style opinions.

  # Rules that apply only to matching files. Each entry = a glob + plain-English instructions.
  path_instructions:
    - path: "lib/features/**/domain/**"
      instructions: |
        The domain layer must stay pure Dart: no Flutter, platform, or
        presentation imports. Entities should be immutable with sensible
        equality.

    - path: "lib/features/**/presentation/**"
      instructions: |
        - Use ref.watch inside build() and ref.read inside event handlers.
        - Check that controllers, focus nodes, and subscriptions are disposed.
        - Check that back navigation and cancel paths leave state consistent.
        - Flag expensive work inside build().

    - path: "lib/features/**/data/**"
      instructions: |
        - Cache keys must fully identify their inputs; flag any lossy
          rounding or missing fields that could return a stale result.
        - Check error handling and that failures reach the caller.

    - path: "lib/core/isolate/**"
      instructions: |
        Image processing runs off the UI thread. Flag work that could block
        the UI isolate, large or unbounded allocations, and unhandled errors
        crossing the isolate boundary.

    - path: "test/**"
      instructions: |
        - Follow Arrange-Act-Assert and use descriptive test names.
        - New behavior should have tests, including edge cases and error or
          cancel/undo paths.
        - Widget tests should pump and settle properly.

    - path: "{android,ios}/**"
      instructions: |
        Flag changes to SDK levels, Java/Kotlin targets, iOS deployment target,
        or Podfile/Gradle settings. Raising a minimum OS version should be
        called out in the PR description.

    - path: "README.md"
      instructions: |
        If behavior or user-facing features changed, check that the README
        still describes them accurately.

chat:
  auto_reply: true
